<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainrot Mart | Premium Stock</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f0f13;
            --card-bg: #1a1a20;
            --accent: #9b4dff;
            --accent-hover: #b575ff;
            --text-main: #ffffff;
            --text-sec: #a1a1aa;
            --success: #4ade80;
            --rarity-common: #9ca3af;
            --rarity-rare: #fbbf24;
            --rarity-toxic: #2dd4bf;
            --rarity-godly: #a855f7;
            --rarity-exotic: #f43f5e;
            --rarity-mythical: #fff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }

        /* Header */
        header {
            background: rgba(15, 15, 19, 0.95);
            padding: 0.8rem 5%;
            position: fixed; width: 100%; top: 0; z-index: 1000;
            border-bottom: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(10px);
        }

        .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-img { height: 55px; width: auto; filter: drop-shadow(0 0 5px rgba(155, 77, 255, 0.3)); transition: 0.3s; }
        .logo-img:hover { transform: scale(1.1) rotate(-5deg); }
        .logo-text { font-size: 1.5rem; font-weight: 800; color: var(--accent); letter-spacing: -1px; text-transform: uppercase; }

        /* Hero */
        .hero {
            min-height: 50vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; background: radial-gradient(circle at center, #2a1b3d 0%, var(--bg-dark) 70%);
            margin-top: 70px; padding: 2rem 1rem;
        }
        .hero h1 { font-size: 3.5rem; margin-bottom: 1rem; background: linear-gradient(to right, #fff, #a1a1aa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: glitch 3s infinite; }
        .hero p { color: var(--text-sec); font-size: 1.2rem; }

        /* Shop Grid */
        .container { max-width: 1400px; margin: 2rem auto; padding: 0 1rem; flex: 1; }
        .section-title { font-size: 2rem; margin-bottom: 2rem; border-left: 5px solid var(--accent); padding-left: 1rem; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }

        .card {
            background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid #333;
            transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-7px); box-shadow: 0 10px 25px rgba(155, 77, 255, 0.15); border-color: var(--accent); }

        .card-img {
            height: 160px; background: #25252e; display: flex; align-items: center; justify-content: center;
            font-size: 3rem; color: #555; transition: 0.3s; position: relative;
        }
        .card:hover .card-img { color: #fff; text-shadow: 0 0 15px #fff; }

        .card-body { padding: 1.2rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        
        .tag { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; text-transform: uppercase; font-weight: bold; display: inline-block; margin-bottom: 0.5rem; }
        .price { float: right; font-weight: bold; color: var(--success); font-size: 1.1rem; }
        
        .card h3 { font-size: 1rem; line-height: 1.4; color: #fff; margin-bottom: 5px; height: 2.8em; overflow: hidden; }
        .card p { color: var(--text-sec); font-size: 0.85rem; margin-bottom: 1rem; height: 1.2em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .btn {
            width: 100%; padding: 10px; background: var(--accent); color: white; border: none; border-radius: 6px;
            font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: auto;
        }
        .btn:hover { background: var(--accent-hover); box-shadow: 0 0 15px var(--accent); }

        /* Footer & Modal */
        footer { background: #050507; border-top: 1px solid #222; padding: 4rem 1rem 1rem; margin-top: 5rem; }
        .footer-content { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 3rem; }
        .footer-col ul { list-style: none; } .footer-col li { margin-bottom: 0.8rem; } .footer-col a { color: var(--text-sec); text-decoration: none; }
        .footer-col h4 { color: #fff; margin-bottom: 1rem; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(5px); }
        .modal-content { background: var(--card-bg); padding: 2rem; border-radius: 16px; width: 90%; max-width: 450px; border: 1px solid #333; }
        .payment-opt { display: flex; align-items: center; gap: 15px; background: #23232a; padding: 1rem; margin: 10px 0; border-radius: 10px; cursor: pointer; border: 1px solid #333; }
        .payment-opt:hover { border-color: var(--accent); background: #2a2a32; }
        .close-btn { background: transparent; border: 1px solid #333; color: #888; padding: 10px; width: 100%; margin-top: 1rem; cursor: pointer; }

        @keyframes glitch { 0%, 100% { text-shadow: 2px 0 #9b4dff, -2px 0 #00ff00; } 50% { text-shadow: none; } }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo_final.png" alt="Brainrot Mart" class="logo-img">
            <div class="logo-text">Brainrot Mart</div>
        </div>
        <div>
            <a href="#" style="color: white; margin-right: 20px; font-weight: bold;">Shop</a>
            <a href="#" style="color: var(--accent); font-weight: bold;">Support</a>
        </div>
    </header>

    <div class="hero">
        <h1>Premium Stock</h1>
        <p>Instant Delivery. Verified Traits. No Cap.</p>
    </div>

    <div class="container">
        <h2 class="section-title">Current Inventory <span style="font-size:1rem; color:#666; margin-left:10px;">(Live Updates)</span></h2>
        
        <!-- THIS IS WHERE ITEMS WILL APPEAR AUTOMATICALLY -->
        <div class="grid" id="product-grid"></div>

    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-col">
                <h4>Shop</h4>
                <ul><li>About Us</li><li>FAQ</li></ul>
            </div>
            <div class="footer-col">
                <h4>Legal</h4>
                <ul>
                    <li onclick="alert('Privacy Policy: We collect basic info for orders only.')" style="cursor:pointer; color:#888;">Privacy Policy</li>
                    <li onclick="alert('Refunds: Only for errors on our end.')" style="cursor:pointer; color:#888;">Refund Policy</li>
                </ul>
            </div>
        </div>
        <div style="text-align: center; margin-top: 3rem; color: #444;">&copy; 2025 Brainrot Mart</div>
    </footer>

    <!-- Payment Modal -->
    <div class="modal" id="paymentModal">
        <div class="modal-content">
            <h2 id="modalTitle">Checkout</h2>
            <p style="color:#888; margin-bottom:1.5rem;">Secure Transaction</p>
            <div class="payment-opt" onclick="handlePayment('paypal')">
                <i class="fa-brands fa-paypal" style="color:#0070ba; font-size:1.5rem;"></i>
                <span>PayPal</span>
            </div>
            <div class="payment-opt" onclick="handlePayment('stripe')">
                <i class="fa-solid fa-credit-card" style="color:#d63384; font-size:1.5rem;"></i>
                <span>Credit Card / iDeal</span>
            </div>
            <button class="close-btn" onclick="document.getElementById('paymentModal').style.display='none'">Cancel</button>
        </div>
    </div>

    <script>
        // CONFIGURATION
        const PAYPAL_EMAIL = "psg46394@gmail.com"; 
        const STRIPE_LINK = "#"; 

        /* 
           ----------------------------------------------------
           --- ADMIN AREA: STOCK LIST -------------------------
           ----------------------------------------------------
           TO ADD ITEMS: Copy a line, paste it, and edit the name/price.
           Icon Options: "fa-radiation", "fa-box", "fa-rainbow", "fa-gem", "fa-rocket", "fa-yin-yang", "fa-trophy"
           Rarity Options: "Toxic", "Common", "Godly", "Legendary", "Exotic", "Rare", "Mythical"
        */
        const products = [
            { name: "Radioactive Esok Sekolah 250M/s", price: 50.0, rarity: "Toxic", traits: "", icon: "fa-radiation" },
            { name: "Base La Grande combinasion: 10M/s", price: 6.0, rarity: "Common", traits: "", icon: "fa-box" },
            { name: "Rainbow Los 25 200M/s", price: 50.0, rarity: "Godly", traits: "Reindeer & Nyan cat", icon: "fa-rainbow" },
            { name: "Rainbow Los 25 100M/s", price: 40.0, rarity: "Godly", traits: "", icon: "fa-rainbow" },
            { name: "Rainbow Noo My Present 60M/s", price: 36.0, rarity: "Godly", traits: "", icon: "fa-rainbow" },
            { name: "Diamond Los 25 115M/s", price: 31.5, rarity: "Legendary", traits: "", icon: "fa-gem" },
            { name: "Galaxy Los Combinasionas 105M/s", price: 55.5, rarity: "Exotic", traits: "", icon: "fa-rocket" },
            { name: "Radioactive Chicleteira 172.5M/s", price: 42.25, rarity: "Toxic", traits: "Bombardino Crocodilo", icon: "fa-radiation" },
            { name: "Base Chimnino 112M/s", price: 16.2, rarity: "Common", traits: "Taco & Nyan Cat", icon: "fa-box" },
            { name: "Gold Los Combinasionas 138.7M/s", price: 28.9, rarity: "Rare", traits: "Bubblegum & Fire", icon: "fa-trophy" },
            { name: "Radioactive Los Candies 195M/s", price: 44.5, rarity: "Toxic", traits: "", icon: "fa-radiation" },
            { name: "Base Mieteteira bicicliteira 117M/s", price: 16.7, rarity: "Common", traits: "Rip Trait", icon: "fa-box" },
            { name: "Base La Taco Combinasion 315M/s", price: 36.5, rarity: "Common", traits: "Bombardino & Fire", icon: "fa-box" },
            { name: "Gold Chimnino 143.5M/s", price: 29.35, rarity: "Rare", traits: "Nyan Cat & Crab", icon: "fa-trophy" },
            { name: "Rainbow 67 120M/s", price: 42.0, rarity: "Godly", traits: "Taco & Crab", icon: "fa-rainbow" },
            { name: "Base Chimnino 210M/s", price: 26.0, rarity: "Common", traits: "Taco, Nyan, Ice, Brazil", icon: "fa-box" },
            { name: "Yin Yang Los 67 213.7M/s", price: 75.0, rarity: "Mythical", traits: "67 Trait", icon: "fa-yin-yang" },
            { name: "Gold Los Combinasionas 123.7M/s", price: 27.5, rarity: "Rare", traits: "Taco & Fire", icon: "fa-trophy" },
            { name: "Rainbow Los Combinasionas 240M/s", price: 54.0, rarity: "Godly", traits: "Bubblegum & Croc", icon: "fa-rainbow" },
        ];

        // RENDER SYSTEM
        const grid = document.getElementById('product-grid');
        
        // Colors for tags
        const colors = { 
            "Common": "#9ca3af", "Rare": "#fbbf24", "Toxic": "#2dd4bf", 
            "Godly": "#a855f7", "Exotic": "#f43f5e", "Legendary": "#3b82f6", "Mythical": "#ffffff" 
        };

        products.forEach(p => {
            const color = colors[p.rarity] || "#ccc";
            const traitHtml = p.traits ? `<p style="color:#aaa; font-size:0.8rem;">(${p.traits})</p>` : `<p>&nbsp;</p>`;
            
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-img" style="color:${color}"><i class="fa-solid ${p.icon}"></i></div>
                <div class="card-body">
                    <div>
                        <span class="tag" style="color:${color}; border:1px solid ${color}33;">${p.rarity}</span>
                        <span class="price">€${p.price.toFixed(2)}</span>
                        <h3>${p.name}</h3>
                        ${traitHtml}
                    </div>
                    <button class="btn" onclick="openPayment('${p.name}', ${p.price})">Buy Now</button>
                </div>
            `;
            grid.appendChild(card);
        });

        // PAYMENT LOGIC
        let currentItem = {};
        const modal = document.getElementById('paymentModal');

        function openPayment(name, price) {
            currentItem = { name, price };
            document.getElementById('modalTitle').innerText = `Buy: ${name}`;
            modal.style.display = 'flex';
        }

        function handlePayment(method) {
            if(method === 'paypal') {
                const url = `https://www.paypal.com/cgi-bin/webscr?cmd=_xclick&business=${PAYPAL_EMAIL}&currency_code=EUR&amount=${currentItem.price}&item_name=${encodeURIComponent(currentItem.name)}`;
                window.open(url, '_blank');
            } else {
                window.open(STRIPE_LINK, '_blank');
            }
            modal.style.display = 'none';
        }

        window.onclick = e => { if(e.target == modal) modal.style.display = 'none'; }
    </script>
</body>
</html>
