<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainrot Mart | Premium Stock</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #050505;
            --bg-card: #121212;
            --accent: #00ff88;
            --accent-hover: #00cc6a;
            --text-main: #ffffff;
            --text-sec: #a1a1aa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }

        /* Header */
        header {
            background: rgba(5, 5, 5, 0.95);
            padding: 0.8rem 5%;
            position: fixed; width: 100%; top: 0; z-index: 1000;
            border-bottom: 1px solid #222;
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(10px);
        }

        .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-img { height: 50px; width: auto; transition: 0.3s; }
        .logo-img:hover { transform: scale(1.1) rotate(-5deg); }
        .logo-text { font-size: 1.5rem; font-weight: 800; color: var(--accent); letter-spacing: -1px; text-transform: uppercase; }

        /* Hero */
        .hero {
            min-height: 45vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; background: radial-gradient(circle at center, #10291f 0%, var(--bg-body) 70%);
            margin-top: 70px; padding: 2rem 1rem;
        }
        .hero h1 { font-size: 3.5rem; margin-bottom: 0.5rem; color: white; text-shadow: 0 0 25px rgba(0, 255, 136, 0.2); }
        .hero p { color: var(--text-sec); font-size: 1.2rem; }

        /* Shop Grid */
        .container { max-width: 1600px; margin: 2rem auto; padding: 0 1.5rem; flex: 1; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; }

        .card {
            background: var(--bg-card); border-radius: 12px; overflow: hidden; border: 1px solid #222;
            transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; position: relative;
        }
        .card:hover { transform: translateY(-7px); border-color: var(--accent); box-shadow: 0 0 25px rgba(0, 255, 136, 0.15); }

        /* Badges */
        .stock-badge {
            position: absolute; top: 10px; right: 10px;
            padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 800;
            color: #000; z-index: 10; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .wishlist-btn {
            position: absolute; top: 10px; left: 10px;
            width: 30px; height: 30px; border-radius: 50%; background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center; color: #fff;
            z-index: 10; cursor: pointer; transition: 0.2s;
        }
        .wishlist-btn:hover { background: var(--accent); color: #000; }

        /* Images */
        .card-img-container {
            width: 100%; height: 220px; background: #1a1a1a;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .card-img-real { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
        .card:hover .card-img-real { transform: scale(1.1); }
        .card-icon-fallback { font-size: 5rem; color: #333; }

        /* Content */
        .card-body { padding: 1.2rem; display: flex; flex-direction: column; flex-grow: 1; gap: 10px; }
        .card h3 { 
            font-size: 1rem; color: #fff; font-weight: 700; line-height: 1.4;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 2.8em; 
        }
        .price { font-size: 1.2rem; font-weight: 800; color: var(--accent); margin-top: auto; }

        .btn {
            width: 100%; padding: 12px; background: transparent; color: var(--accent); 
            border: 1px solid var(--accent); border-radius: 8px; font-weight: bold; cursor: pointer; 
            transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }

        /* Footer & Modal */
        footer { background: #080808; border-top: 1px solid #222; padding: 4rem 1rem 1rem; margin-top: 5rem; }
        .footer-content { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 3rem; }
        .footer-col ul { list-style: none; } .footer-col li { margin-bottom: 0.8rem; } .footer-col a { color: var(--text-sec); text-decoration: none; }
        .footer-col h4 { color: #fff; margin-bottom: 1rem; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(5px); }
        .modal-content { background: #1a1a1a; padding: 2rem; border-radius: 16px; width: 90%; max-width: 450px; border: 1px solid #333; }
        .payment-opt { display: flex; align-items: center; gap: 15px; background: #23232a; padding: 1rem; margin: 10px 0; border-radius: 10px; cursor: pointer; border: 1px solid #333; }
        .payment-opt:hover { border-color: var(--accent); background: #2a2a32; }
        .close-btn { background: transparent; border: 1px solid #333; color: #888; padding: 10px; width: 100%; margin-top: 1rem; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo_final.png" alt="Brainrot Mart" class="logo-img">
            <div class="logo-text">Brainrot Mart</div>
        </div>
        <div>
            <a href="#" style="color: white; margin-right: 20px; font-weight: bold;">Shop</a>
            <a href="#" style="color: var(--accent); font-weight: bold;">Support</a>
        </div>
    </header>

    <div class="hero">
        <h1>Premium Stock</h1>
        <p>Instant Delivery. Verified Traits. No Cap.</p>
    </div>

    <div class="container">
        <div class="grid" id="product-grid"></div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-col">
                <h4>Shop</h4>
                <ul><li>About Us</li><li>FAQ</li></ul>
            </div>
            <div class="footer-col">
                <h4>Legal</h4>
                <ul>
                    <li onclick="alert('Privacy Policy: We collect basic info for orders only.')" style="cursor:pointer; color:#888;">Privacy Policy</li>
                    <li onclick="alert('Refunds: Only for errors on our end.')" style="cursor:pointer; color:#888;">Refund Policy</li>
                </ul>
            </div>
        </div>
        <div style="text-align: center; margin-top: 3rem; color: #444;">&copy; 2025 Brainrot Mart</div>
    </footer>

    <!-- Payment Modal -->
    <div class="modal" id="paymentModal">
        <div class="modal-content">
            <h2 id="modalTitle" style="color: white;">Checkout</h2>
            <p style="color:#888; margin-bottom:1.5rem;">Secure Transaction</p>
            <div class="payment-opt" onclick="handlePayment('paypal')">
                <i class="fa-brands fa-paypal" style="color:#0070ba; font-size:1.5rem;"></i>
                <span style="color: white;">PayPal</span>
            </div>
            <div class="payment-opt" onclick="handlePayment('stripe')">
                <i class="fa-solid fa-credit-card" style="color:#d63384; font-size:1.5rem;"></i>
                <span style="color: white;">Credit Card / iDeal</span>
            </div>
            <button class="close-btn" onclick="document.getElementById('paymentModal').style.display='none'">Cancel</button>
        </div>
    </div>

    <script>
        // CONFIG
        const PAYPAL_EMAIL = "psg46394@gmail.com"; 
        const STRIPE_LINK = "#"; 

        /* 
           --- STOCK LIST ---
           Paste your image links inside the "image" quotes. 
           If "image" is empty "", it shows the icon.
        */
        const products = [
            { 
                name: "Radioactive Esok Sekolah 250M/s", 
                price: 50.00, 
                stock: 3, 
                image: "https://placehold.co/400x400/111/00ff88?text=Radioactive", // EXAMPLE
                icon: "fa-radiation" 
            },
            { 
                name: "Base La Grande combinasion: 10M/s", 
                price: 6.00, 
                stock: 12, 
                image: "", 
                icon: "fa-box" 
            },
            { name: "Rainbow Los 25 200M/s (Reindeer & Nyan)", price: 50.00, stock: 1, image: "", icon: "fa-rainbow" },
            { name: "Rainbow Los 25 100M/s", price: 40.00, stock: 5, image: "", icon: "fa-rainbow" },
            { name: "Rainbow Noo My Present 60M/s", price: 36.00, stock: 2, image: "", icon: "fa-rainbow" },
            { name: "Diamond Los 25 115M/s", price: 31.50, stock: 8, image: "", icon: "fa-gem" },
            { name: "Galaxy Los Combinasionas 105M/s", price: 55.50, stock: 4, image: "", icon: "fa-rocket" },
            { name: "Radioactive Chicleteira 172.5M/s", price: 42.25, stock: 1, image: "", icon: "fa-radiation" },
            { name: "Base Chimnino 112M/s (Taco & Nyan)", price: 16.20, stock: 15, image: "", icon: "fa-box" },
            { name: "Gold Los Combinasionas 138.7M/s", price: 28.90, stock: 6, image: "", icon: "fa-trophy" },
            { name: "Radioactive Los Candies 195M/s", price: 44.50, stock: 3, image: "", icon: "fa-radiation" },
            { name: "Base Mieteteira bicicliteira 117M/s", price: 16.70, stock: 10, image: "", icon: "fa-box" },
            { name: "Base La Taco Combinasion 315M/s", price: 36.50, stock: 7, image: "", icon: "fa-box" },
            { name: "Gold Chimnino 143.5M/s", price: 29.35, stock: 4, image: "", icon: "fa-trophy" },
            { name: "Rainbow 67 120M/s", price: 42.00, stock: 2, image: "", icon: "fa-rainbow" },
            { name: "Base Chimnino 210M/s", price: 26.00, stock: 9, image: "", icon: "fa-box" },
            { name: "Yin Yang Los 67 213.7M/s", price: 75.00, stock: 1, image: "", icon: "fa-yin-yang" },
            { name: "Gold Los Combinasionas 123.7M/s", price: 27.50, stock: 5, image: "", icon: "fa-trophy" },
            { name: "Rainbow Los Combinasionas 240M/s", price: 54.00, stock: 2, image: "", icon: "fa-rainbow" },
        ];

        // RENDER SYSTEM
        const grid = document.getElementById('product-grid');

        products.forEach(p => {
            // Logic for Badge Color
            let stockColor = '#00ff88'; 
            if(p.stock <= 5) stockColor = '#ff9900'; 
            if(p.stock <= 2) stockColor = '#ff3333'; 

            // Logic for Image vs Icon
            let imageHtml = '';
            if (p.image && p.image.length > 5) {
                imageHtml = `<img src="${p.image}" class="card-img-real" alt="${p.name}">`;
            } else {
                imageHtml = `<i class="fa-solid ${p.icon} card-icon-fallback"></i>`;
            }

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="wishlist-btn"><i class="fa-regular fa-heart"></i></div>
                <div class="stock-badge" style="background:${stockColor}; box-shadow: 0 0 10px ${stockColor};">
                    ${p.stock} Left
                </div>
                
                <div class="card-img-container">
                    ${imageHtml}
                </div>

                <div class="card-body">
                    <h3>${p.name}</h3>
                    <div style="display:flex; align-items:center; justify-content:space-between; margin-top:auto;">
                        <span class="price">$${p.price.toFixed(2)}</span>
                    </div>
                    <button class="btn" onclick="openPayment('${p.name}', ${p.price})">
                        Buy Now <i class="fa-solid fa-cart-shopping"></i>
                    </button>
                </div>
            `;
            grid.appendChild(card);
        });

        // PAYMENT
        let currentItem = {};
        const modal = document.getElementById('paymentModal');

        function openPayment(name, price) {
            currentItem = { name, price };
            document.getElementById('modalTitle').innerText = `Buy: ${name}`;
            modal.style.display = 'flex';
        }

        function handlePayment(method) {
            if(method === 'paypal') {
                const url = `https://www.paypal.com/cgi-bin/webscr?cmd=_xclick&business=${PAYPAL_EMAIL}&currency_code=EUR&amount=${currentItem.price}&item_name=${encodeURIComponent(currentItem.name)}`;
                window.open(url, '_blank');
            } else {
                window.open(STRIPE_LINK, '_blank');
            }
            modal.style.display = 'none';
        }

        window.onclick = e => { if(e.target == modal) modal.style.display = 'none'; }
    </script>
</body>
</html>
